<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Login — Vaishnavi Goyal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #08080d; --card: #111118; --border: rgba(255,255,255,0.08);
    --accent: #c8f060; --text: #f0eee8; --muted: #666;
    --fd: 'Syne', sans-serif; --fb: 'DM Sans', sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--fb); min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }

  /* Background grid */
  body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 60px 60px; pointer-events: none; mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 0%, transparent 80%); }

  /* Glow blobs */
  .blob { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; }
  .blob-1 { width: 400px; height: 400px; background: rgba(123,110,246,0.08); top: -10%; left: -10%; }
  .blob-2 { width: 300px; height: 300px; background: rgba(200,240,96,0.05); bottom: -5%; right: -5%; }

  .login-card { position: relative; width: 420px; max-width: 95vw; background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 2.5rem; animation: fadeUp 0.6s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }

  /* Top accent line */
  .login-card::before { content: ''; position: absolute; top: 0; left: 2rem; right: 2rem; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.4; }

  .login-brand { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem; }
  .brand-mark { width: 36px; height: 36px; border-radius: 10px; background: rgba(200,240,96,0.1); border: 1px solid rgba(200,240,96,0.2); display: flex; align-items: center; justify-content: center; font-family: var(--fd); font-size: 0.85rem; font-weight: 800; color: var(--accent); }
  .brand-text { font-family: var(--fd); font-size: 0.9rem; font-weight: 700; }
  .brand-sub { font-size: 0.7rem; color: var(--muted); margin-top: 1px; }

  h1 { font-family: var(--fd); font-size: 1.6rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.4rem; }
  .login-sub { font-size: 0.85rem; color: var(--muted); margin-bottom: 2rem; font-weight: 300; }

  .field { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
  .field label { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.04em; }
  .field input {
    background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    border-radius: 10px; padding: 0.8rem 1rem;
    color: var(--text); font-family: var(--fb); font-size: 0.9rem;
    outline: none; transition: border-color 0.2s, background 0.2s; width: 100%;
  }
  .field input:focus { border-color: rgba(200,240,96,0.4); background: rgba(200,240,96,0.03); }
  .field input::placeholder { color: rgba(120,120,120,0.6); }

  .btn-login {
    width: 100%; padding: 0.9rem;
    background: var(--accent); color: #0a0a0f;
    font-family: var(--fb); font-size: 0.9rem; font-weight: 600;
    border: none; border-radius: 12px; cursor: pointer;
    transition: opacity 0.2s, transform 0.2s;
    margin-top: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
  }
  .btn-login:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn-login:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .login-footer { text-align: center; margin-top: 1.5rem; font-size: 0.75rem; color: var(--muted); }
  .login-footer a { color: rgba(200,240,96,0.6); text-decoration: none; }
  .login-footer a:hover { color: var(--accent); }

  .error-msg { background: rgba(255,77,77,0.08); border: 1px solid rgba(255,77,77,0.2); border-radius: 10px; padding: 0.7rem 1rem; font-size: 0.82rem; color: #ff6b6b; margin-bottom: 1rem; display: none; }
  .error-msg.show { display: block; }

  /* Spinner */
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(10,10,15,0.3); border-top-color: #0a0a0f; border-radius: 50%; animation: spin 0.6s linear infinite; display: none; }
  .btn-login.loading .spinner { display: block; }
  .btn-login.loading .btn-label { display: none; }
  @keyframes spin { to{transform:rotate(360deg)} }
</style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="login-card">
  <div class="login-brand">
    <div class="brand-mark">VG</div>
    <div><div class="brand-text">VG. Portfolio</div><div class="brand-sub">Admin access only</div></div>
  </div>

  <h1>Welcome back</h1>
  <p class="login-sub">Sign in to manage your portfolio content.</p>

  <div class="error-msg" id="errorMsg"></div>

  <div class="field">
    <label>Email address</label>
    <input type="email" id="loginEmail" placeholder="vaishnavi@example.com" autocomplete="email"/>
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password"/>
  </div>

  <button class="btn-login" id="loginBtn">
    <span class="btn-label">Sign in →</span>
    <div class="spinner"></div>
  </button>

  <p class="login-footer"><a href="/">← Back to portfolio</a></p>
</div>

<script src="/js/login.js">
// If already have a valid session cookie, go straight to admin
// (server handles the actual check via /api/auth/verify)
async function checkExistingSession() {
  try {
    const res = await fetch('/api/auth/verify');
    if (res.ok) window.location.href = '/admin';
  } catch { /* not logged in, stay on page */ }
}
checkExistingSession();

// Enter key support
document.getElementById('loginPassword').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleLogin();
});
document.getElementById('loginEmail').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('loginPassword').focus();
});

// Bind the button click securely using JS instead of HTML attributes
document.getElementById('loginBtn').addEventListener('click', handleLogin);
async function handleLogin() {
  const email    = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn      = document.getElementById('loginBtn');
  const errMsg   = document.getElementById('errorMsg');

  errMsg.classList.remove('show');

  if (!email || !password) {
    errMsg.textContent = 'Please enter your email and password.';
    errMsg.classList.add('show');
    return;
  }

  btn.classList.add('loading');
  btn.disabled = true;

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (res.ok && data.success) {
      // Token is already set as HTTP-only cookie by the server.
      // Redirect to admin dashboard.
      window.location.href = '/admin';
    } else {
      errMsg.textContent = data.error || 'Invalid credentials. Please try again.';
      errMsg.classList.add('show');
      document.getElementById('loginPassword').value = '';
    }
  } catch {
    errMsg.textContent = 'Network error. Is the server running?';
    errMsg.classList.add('show');
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}
</script>
</body>
</html>
